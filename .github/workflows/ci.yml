name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Test
        run: python -m pytest
      - name: Demo
        run: python -m machineear demo --output demo-out
      - name: Upload demo report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-report
          path: |
            demo-out/summary.html
            demo-out/result.json
            demo-out/scores.csv
            demo-out/summary.txt
          if-no-files-found: error
